# mib2high-overlay.conf - warstwa graficzna na Virtual Cockpit (Etap 7)
#
# Instalowany jako /mnt/app/root/mib2high-overlay.conf.
# Czytaja go: vc_overlay (renderer) i vc_overlay_probe (sonda).
#
# Wartosci mozna poprawic NA KARCIE, bez przebudowy binarek - po to ten plik
# istnieje. Format: "klucz wartosc", # zaczyna komentarz, nieznane klucze sa
# pomijane (dzieki temu nowsza karta pozostaje czytelna dla starszej binarki).

# Numer displayable, ktory bierzemy dla siebie.
#   DisplayManager bierze ten numer z CAPTIONU okna KD, robi na nim atoi()
#   i nie sprawdza go z niczym - ani z konfiguracja, ani z lista zajetych,
#   ani z duplikatami (docs/19_displayable_na_mhi2.md).
#   Zakres 61..99 jest wolny: najwyzszy nazwany displayable w tym firmware to
#   60 (DISPLAYABLE_HUD_MAP_VIEW - sprawdzone javap na lsd.jxe z auta), a 101/102
#   to podkladki KDK. 98 to ten sam numer, ktorego uzywa Luka na MHI2Q, wiec
#   jego stale w protocol.h pozostaja czytelne.
#   NIE wpisuj 0 ani liczby ujemnej: "0" dalby nam cudzy displayable 0,
#   a "-1" DisplayManager ignoruje bez slowa. Dopuszczalne 1..109
#   (MAX_DISPLAYABLES = 110 po stronie HMI).
#   UWAGA: `dmdt gd` NIE nadaje sie do sprawdzenia, czy numer jest zajety -
#   numer siedzi na oknie, nie na zadnej liscie, ktora gd drukuje. Dowodem
#   jest log renderera i plik /tmp/vc-overlay-ready, nie wyjscie dmdt.
displayable 98

# Rozmiar PLOTNA RENDERERA - w czym maneuver_render rysuje scene.
#   NIE DOTYKAC. To nie jest rozmiar okna, tylko uklad wspolrzednych calego
#   renderera Luki (CR_DEFAULT_WIDTH/HEIGHT z upstream/protocol.h). On sie NIE
#   skaluje: srodkowanie manewru liczy z CR_DEFAULT_HEIGHT i CR_POPUP_Y
#   (render.c:1219), kazdy element 2D przelicza na NDC przez CR_DEFAULT_*
#   (render.c:1425), noze wyprowadza z tych samych stalych (render.c:1407),
#   a solver kadrowania pasow ma aspekt 328.f/181 wpisany na sztywno
#   (scene/lane_panel.cpp:286).
#   WIZYTA 2026-10-27: tu stalo 210x153 (zmierzony fabryczny kafelek) i scena
#   renderowala sie w zlym kadrze - 34 komendy rysowania w logu, zero strzalki
#   na kombi. Pomiar kafelka nalezy do width/height nizej, nie tutaj.
#   Od przesuwania i przycinania sa crop_x/crop_y, width/height oraz x/y.
render_width  328
render_height 181

# Ktory kawalek tego plotna trafia na kombi (CR_POPUP_X/Y u Luki).
#   protocol.h:114 nazywa to "big-screen popup crop within the 328x180 content
#   area": renderer wkadrowuje gotowy manewr dokladnie w ten prostokat, a to,
#   co jest poza nim, to rusztowanie (jezdnia wybiegajaca poza kafelek, maski,
#   pas kasowania pod lista pasow). Pokazujemy sam crop.
crop_x 59
crop_y 27

# Rozmiar cropu, czyli ile pikseli kafelka widac na kombi.
#   To jeden z dwoch stylow KVS_FPK, ktore to firmware w ogole zna:
#   navigation/resources/app/au/eu/pcconfig/komoviewstyle.conf
#       2; KVS_FPK;210x153
#       3; KVS_FPK;328x181
#   ZMIERZONE W AUCIE 2026-10-26 (zrzuty `dmdt ts 4`): fabryczny panel manewru
#   to 210 x 153 piksele - czyli dokladnie styl 2. W obu ukladach ten sam
#   rozmiar, rozna tylko pozycja (patrz x/y nizej).
#   To koryguje docs/02_edzenis_vs_K3346.md:133, gdzie stalo "328x180" - ta
#   liczba byla szacunkiem z innego auta, nie pomiarem.
#   Ze to rowna sie CR_POPUP_W/H u Luki nie jest przypadkiem: oba kombi biora
#   kafelek manewru z tego samego katalogu stylow. Dzieki temu blit jest 1:1,
#   bez skalowania i bez polteksela przesuniecia.
width  210
height 153

# Rozmiar OKNA, czyli calego plotna kombi.
#   ROZSTRZYGNIETE W AUCIE 2026-10-27. DisplayManager przyjmuje okno z numerem
#   displayable, dla ktorego nie ma wpisu, honoruje jego ROZMIAR co do piksela
#   (sonda 210x153 wyszla na zrzucie jako bbox (0,0)-(209,152)) i kladzie je
#   ZAWSZE w (0,0). Pozycji nie nadaje i nie ma o nia jak poprosic: `dmdt gd`
#   i `gs` zwracaja na tej jednostce zero bajtow, a `dmdt gc` nie ma geometrii.
#   Dlatego okno bierze cale plotno, a panel jest w nim rysowany na offsecie
#   (platform_harman.c, composite_panel). 1440x542 to ten sam rozmiar, w ktorym
#   pracuje renderer mapy z Etapu 3 i w ktorym wracaja zrzuty `dmdt ts 4`.
canvas_width  1440
canvas_height 542
#
#   FURTKA AWARYJNA, bez przebudowy binarki. Jedyne, czego nie dalo sie
#   sprawdzic na biurku ani zrzutem: czy nasza przezroczystosc przepuszcza
#   mape CarPlay. Zrzuty `dmdt ts` tego nie pokaza - mapa jedzie warstwa
#   sprzetowa i nie ma jej na zrzucie (ustalone na wizycie 1). Odpowie dopiero
#   oko przy dzialajacym rendererze.
#   Gdyby kombi zrobilo sie czarne zamiast mapy: wpisz tu
#       canvas_width  210
#       canvas_height 153
#   Wtedy okno ma rozmiar samego panelu i DisplayManager kladzie je w (0,0) -
#   strzalka laduje w lewym gornym rogu, brzydko, ale mapa wraca. Zmiana
#   dziala po restarcie sesji CarPlay (odlacz i podlacz telefon).

# Gdzie kafelek manewru siedzi NA PLOTNIE w kazdym z ukladow VC (zmierzone).
#   x/y         = slot 1, DUZE zegary - w srodku prawego zegara
#   x_alt/y_alt = slot 0, MALE zegary - prawy gorny rog mapy
#   Pomiar z 2026-10-26 (zrzuty `dmdt ts 4`) jest dokladny co do piksela, ale
#   ETYKIETY byly zamienione: sonda kazala tylko "przelaczyc VIEW na drugi
#   uklad" i nie zapisala, od ktorego auto zaczelo. Rozstrzyga geometria
#   (2026-10-28): przy malych zegarach maly predkosciomierz zaczyna sie ok.
#   y=296, wiec kafelek konczacy sie na y=360 wchodzilby na niego; przy duzych
#   pozycja 1091/110 lezy w gornej polowie zegara, pod napisem odleglosci VC -
#   i tam wlasnie znikala strzalka.
#   Slot renderer czyta z przechwytu DSI (/tmp/v8l-dsitracer-1798-NN.log,
#   rekord BAP 50/54) - dawniej mial go z loga hooka, ale hook pisze go na
#   poziomie INFO, ktorego nie zapisuje, wiec po VIEW nic sie nie przesuwalo.
#   GDYBY jednak bylo odwrotnie: zamien te dwie pary liczb tutaj, bez przebudowy.
#   Wartosc, przy ktorej kafelek wyszedlby poza plotno, jest przycinana
#   (overlay_cfg.h) - to literowka na karcie, nie pozycja.
x      1055
y      207
x_alt  1091
y_alt  110

# Ile gornych wierszy wycinka zaslania VC w danym ukladzie (domyslnie 0 = nic).
#   Przy skrecie RAMIE strzalki lezy w samej gorze wycinka. Gdyby przy duzych
#   zegarach VC zaslanial gore kafelka swoim napisem odleglosci, ramie by
#   znikalo. Wpisz wtedy np. `visible_top_big 35`: renderer przekadruje
#   manewr ponizej tego pasa (to samo wywolanie, ktorym na MHI2Q steruje Java -
#   CMD_VISIBLE_AREA), plynnie, bez przebudowy. Musi zostac co najmniej 16 wierszy.
visible_top_big   0
visible_top_small 0

# Wyswietlacz KD, na ktorym ma powstac okno.
#   -1 = NIE ustawiaj wlasciwosci DISPLAY. Tak robi fabryczny przepis
#   (libdisplayinit.so display_create_window, /eso/bin/apps/loadandshowimage)
#   i trafia na kombi, czyli domyslny display jest wlasciwy.
#   0..8 = ustaw jawnie. Pokretlo zostaje, ale domyslnie idziemy sciezka
#   udowodniona w fabrycznym oprogramowaniu.
display -1

# Kontekst DisplayManagera, ktory deklaruje skrypt powloki.
#   Informacyjnie dla logu renderera - `dmdt dc/sc` wola WYLACZNIE
#   mib2high-lvds-control.sh. Jeden pisarz kontekstu, tak jak dzis dla mapy.
context 901

# Co stoi ZA nasza nakladka w kontekscie 901, od przodu do tylu.
#   Czyta to mib2high-lvds-control.sh: `dmdt dc 901 <displayable> <to ponizej>`.
#   58 to strumien mapy CarPlay. 101 i 102 towarzysza displayable 20 w kazdym
#   fabrycznym kontekscie prowadzenia (73, 74, 77); 20 pomijamy, bo to zrodlo
#   fabrycznej strzalki, ktora zastepujemy.
#   PO CO TEN KLUCZ: na wizycie 2026-10-27 na kombi pojawil sie czarny
#   prostokat w miejscu panelu manewru, takze przy wylaczonej nawigacji.
#   Nie wiadomo jeszcze, czy to nasz panel, czy wlasnie 101/102 odslonietych
#   po usunieciu 20. Jesli po tej wersji prostokat zostanie, wpisz tu samo
#   `58` - poprawka bez przebudowy binarek.
#   NIE usuwamy 101/102 na slepo: zielona karta instrukcji CarPlay
#   ("towards <ulica>") moze siedziec wlasnie na nich.
context_recipe 102 101 58

# 1 = alfa per-piksel, zeby nakladka mieszala sie z mapa pod spodem.
#   DisplayManager sklada materialem premultiplied_alpha, wiec renderer pisze
#   rgb*a (glBlendFuncSeparate w render.c).
#   POTWIERDZONE W AUCIE 2026-10-27: schodek alfy sondy wrocil na zrzucie jako
#   dokladnie 0, 51, 102, 153, 204, 255 - czyli 255*a co do jedynki. Alfa jest
#   mieszana per-piksel i premultiplikacja po naszej stronie jest poprawna.
#   UWAGA: wlasciwosc SOURCE_ALPHA na samym oknie KD jest na tej jednostce
#   odrzucana ("SOURCE_ALPHA=1 REFUSED" w logu) i nie ma to znaczenia -
#   mieszanie robi kompozytor, nie wlasciwosc okna.
alpha 1

# IGNOROWANY na tej jednostce - jej DisplayManager nie ma wlasciwosci
#   MANAGED_QNX w ogole; okno przyjmuje sam, po samym captionie.
#   Klucz zostawiony, zeby starsza karta parsowala sie bez ostrzezen.
managed 1

# Interwal swapu i tempo renderu.
swap_interval 2
fps 30
