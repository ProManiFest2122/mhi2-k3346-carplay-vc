# Views 2/3: BIG gauges, topAligned.  h=294 keeps the narrow card layout valid (0.3*h > 87).
# Views 1-3: y 88..382, the area of luka-dev 7490ffd1 (his VC bar starts at y=384).  On
#            the big gauges y 90..390 put the Apple box right above the bar (run-87).
# Physical: the real 12.3" panel. CarPlaySupport scales its card layout and the ETA height
#           threshold from this size; 200x75 hid the ETA for third-party apps at h=290.
# Advertised video canvas remains 1440x542; physical output unchanged.
