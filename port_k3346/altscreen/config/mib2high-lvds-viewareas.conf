# K3346: safe areas keep the iOS ETA box clear of the gauges and the VC bar.
# Views 0/1: SMALL gauges, leftAligned.
#   View 0 (no route): unchanged, there is no ETA box without a route.
#   View 1 (route): x past the left gauge as before.  Narrow (w=480, right edge 780, well
#            clear of the maneuver tile at x=1091): Apple Maps puts its wide ETA box in the
#            middle of the area and ignores leftAligned, so at w=672 it stood in the middle
#            of the map (car, rc21, run-87).  At w=480 it starts about where the Google Maps
#            box does.  Google keeps its card and box at the left edge, so only the car
#            marker moves left with the middle.  Apple shows its narrow box (arrival only)
#            at w=460 on the big gauges, and at w=480 here too (rc22, run-90).  Now only
#            for the card (Pelna) with apps other than Apple Maps; Apple Maps goes to
#            view 5 or 6, other apps without the card to view 5 (2.0.0-rc8).
# Views 2/3: BIG gauges, topAligned.  h=294 keeps the narrow card layout valid (0.3*h > 87).
# Views 1-3: y 88..382, the area of luka-dev 7490ffd1 (his VC bar starts at y=384).  On
#            the big gauges y 90..390 put the Apple box right above the bar (run-87).
# Physical: the real 12.3" panel. CarPlaySupport scales its card layout and the ETA height
#           threshold from this size; 200x75 hid the ETA for third-party apps at h=290.
# Advertised video canvas remains 1440x542; physical output unchanged.
# rc30: since rc29 the ETA box is ours (overlay/eta_pill.h) and the phone draws none.
#       Ours and the call card stand at y 334..378, right above the VC bar.  The phone
#       draws its car marker and, Google Maps, the street label under it low in the
#       area (centre about y 293, label to about 360 at h=294: car, rc29, IMG_0783..0788),
#       right under our box.  So every area WITH a route now ends at y 334 (h=246), and
#       the phone keeps its own things above.  View 3 was the exception until
#       2.0.0-rc10, see there.
physical 292 110
view 0 360 65 720 367
view 1 300 88 480 246
