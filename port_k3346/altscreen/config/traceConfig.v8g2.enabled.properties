#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
#
# Settings for the appender
#    telnet
#
# This appender is a 'normal' telnet appender.
# To trace this activate a telnet console with the <TargetIP> and the port 1798.
#
#''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''
appender.telnet=de.audi.tghu.dsitrace.appender.TelnetAppender
appender.telnet.port=1798
#------------------------------------------------------------------------------

#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
#
# Settings for the appender
#    bluepirat
#
# This appender is a 'special' telnet appender for the blue PiraT logger.
# blue PiraT Configuration:
#   - activate Ethernet #M
#   - set name to 'DSI'
#   - use the fixed IP of the MMX: 172.16.250.248
#   - port=20991, protocol=raw, timeout=30
#''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''
appender.bluepirat=de.audi.tghu.dsitrace.appender.BufferedTelnetAppender
appender.bluepirat.port=20991
#------------------------------------------------------------------------------

#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
#
# Settings for the appender
#    client
#
# This appender communicates with the DSIClient application on the PC.
# This appender has a in-memory-buffer that holds the log messages when
# the connection to the DSIClient is closed. Use 'fixBufferSize' (holds the first n
# log messages during the startup; default is 0KB) and 'rollingBufferSize' (holds the
# log messages while the client is disconnected; default is 32KB) to customize the buffer.
#
#''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''
appender.client=de.audi.tghu.dsitrace.appender.ClientAppender
appender.client.port=1800
appender.client.lib=/eso/hmi/lsd/DSITracer-clientData.bin
appender.client.immediateFlush=true
#appender.client.fixBufferSize=100KB
#appender.client.rollingBufferSize=100KB
#------------------------------------------------------------------------------

#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
#
# Settings for emulator extension
#   DSIKeyPanel simulation from DSITracer-client
#''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''
extension.DSIKeyPanelEx=de.audi.tghu.dsitrace.extension.EmulatorExtension
extension.DSIKeyPanelEx.DSIBaseAdapter=de.audi.tghu.emulator.keypanel.DSIKeyPanelPlayerAdapter
extension.DSIKeyPanelEx.PlayerRunnable=de.audi.tghu.emulator.keypanel.KeyPanelTelnetService
#------------------------------------------------------------------------------

#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
#
# Settings for internal controller
#''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''
extension.ctrl=de.audi.tghu.dsitrace.extension.ExternallyControlExtension
extension.ctrl.port=1797
#------------------------------------------------------------------------------

