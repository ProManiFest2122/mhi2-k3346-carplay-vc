#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
#
# DSITracer configuration file
# point the system property "de.audi.tghu.traceConfig" to this file.
#
#------------------------------------------------------------------------------

#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
#
# global section
#
#''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''
# 'use.appender' is to define the active appenders.
# Comment out 'use.appender' to deactivate the DSITracer.
# Possible appenders are:
#   - client
#   - bluepirat
#
# More than one appender can be used at a time. To do so just create a
# comma separated line with all wanted appenders.
# For each appender there are additional settings in the next sections.
#
use.appender=telnet,bluepirat
activate.extension=ctrl
#activate.extension=ctrl,DSIKeyPanelEx
#------------------------------------------------------------------------------

#++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++++
#
# Trace configuration section
# To activate the trace for a specific DSI just uncomment the specific line.
# I.e. to trace the DSIAudio just remove the leading '#' from the line
#    '#org.dsi.ifc.audio.DSIAudio=small'
# With the original configuration nothing will be traced.
#
# Meaning of the settings for a trace:
#   org.dsi.ifc.audio.DSIAudio=small
#   -> enables trace in small mode for all instances of DSIAudio and each DSIAudioListener
#
#   org.dsi.ifc.audio.DSIAudio=0:small,1:full
#   -> enables trace in small mode for instance 0 of DSIAudio and its DSIAudioListener
#   -> enables trace in full mode for instance 1 of DSIAudio and its DSIAudioListener
#
#   modes:
#     small - only the method name is logged
#     full  - method with all parameter is logged
#
#   Tip: You can use VI's regex support to quickly change the trace scopes, e.g.
#
#   1) Switch off tracing for all DSI scopes:
#      :% s/^\(org.dsi.ifc\)/#\1
#   2) Enable tracing for all scopes in 'small mode'
#      :% s/^#\(org.dsi.ifc.*small\)/\1
#   3) Enable tracing for all 'car' DSIs in 'full mode':
#      :% s/^#\(org.dsi.ifc.car.*full\)/\1
#
#''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''''
