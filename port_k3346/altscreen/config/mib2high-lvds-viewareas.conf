# K3346: safe areas keep the iOS ETA box clear of the gauges and the VC bar.
# Views 0/1: SMALL gauges, leftAligned.
#   View 0 (no route): unchanged, there is no ETA box without a route.
#   View 1 (route): x past the left gauge as before.  Narrow (w=480, right edge 780, well
#            clear of the maneuver tile at x=1091): Apple Maps puts its wide ETA box in the
#            middle of the area and ignores leftAligned, so at w=672 it stood in the middle
#            of the map (car, rc21, run-87).  At w=480 it starts about where the Google Maps
#            box does.  Google keeps its card and box at the left edge, so only the car
#            marker moves left with the middle.  Apple shows its narrow box (arrival only)
