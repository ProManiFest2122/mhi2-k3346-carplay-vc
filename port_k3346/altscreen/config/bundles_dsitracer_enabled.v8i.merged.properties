# Common bundles.properties for MIB2

# Activate a ServiceDelegateConfigurator. This feature is needed to implement the DSITracer
# if it is activated, the DSITrace bundle has to be started as first bundle in autostart list.
# Note: The following entry will be modified (commented in/out) by build scripts
de.audi.tghu.serviceDelegateConfigurator=de.audi.tghu.dsitrace.TraceConfigurator

# autostart bundles. Entry will be modified by build scripts
# is replaced by value (variant.bundles.autostart) defined in variant files (zzzBuild/variants).
