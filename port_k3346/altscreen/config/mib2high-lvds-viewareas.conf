#         rc9, run-07 and IMG_0805: the label hidden with the card, right above the box
#         without it, view 8).
#         2.0.0-rc10: ends at y 334 as view 8, only h changes.  NOT KNOWN: whether the
#         phone still draws the card on top at h=246 (0.3*h = 74).  The small gauges keep
